name: Build Mac App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install electron @electron/packager
      - run: npx @electron/packager . "PTE-Mock-Exam" --platform=darwin --arch=arm64 --out=dist
      - run: cd dist && zip -r ../PTE-Mac-App.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: PTE-Mock-Exam-Mac
          path: PTE-Mac-App.zip
