    /* SPEAKING & GENERAL RECORDING HANDLERS */
    function startGenericPreparation(prepSecs, recSecs) {
      currentPrepSeconds = prepSecs;
      document.getElementById('recStatus').innerText = `Recording in ${currentPrepSeconds}`;
      document.getElementById('recDot').classList.remove('active');
      document.getElementById('recBarFill').style.width = '0%';
      document.getElementById('recTimeText').innerText = formatSeconds(recSecs);

      prepTimer = setInterval(() => {
        currentPrepSeconds--;
        if (currentPrepSeconds > 0) {
          document.getElementById('recStatus').innerText = `Recording in ${currentPrepSeconds}`;
        } else {
          clearInterval(prepTimer);
          playPearsonBeep();
          setTimeout(() => startGenericRecording(recSecs), 350);
        }
      }, 1000);
    }

    function startGenericRecording(recSecs) {
      const item = examFlow[currentStepIndex];
      currentRecordingTaskTitle = item ? item.title : "Speaking Task";
      remainingRecSeconds = recSecs;
      document.getElementById('recStatus').innerText = "Recording";
      document.getElementById('recDot').classList.add('active');
      audioChunks = [];

      if (mediaRecorder && mediaRecorder.state === "inactive") {
        mediaRecorder.start();
      }

      recTimer = setInterval(() => {
        remainingRecSeconds--;
        const elapsed = recSecs - remainingRecSeconds;
        const pct = (elapsed / recSecs) * 100;

        document.getElementById('recBarFill').style.width = `${pct}%`;
        document.getElementById('recTimeText').innerText = formatSeconds(remainingRecSeconds);

        if (remainingRecSeconds <= 0) {
          clearInterval(recTimer);
          handleNextClick();
        }
      }, 1000);
    }

    function playAudioPrompt(audioSrc, prepSecs, recSecs) {
      globalAudio.src = audioSrc;
      globalAudio.load();

      let playStarted = false;
      globalAudio.oncanplaythrough = () => {
        if (!playStarted) {
          playStarted = true;
          globalAudio.play().catch(e => console.log("Audio error:", e));
        }
      };

      globalAudio.ontimeupdate = () => {
        const cur = globalAudio.currentTime || 0;
        const dur = globalAudio.duration || 1;
        const pct = (cur / dur) * 100;
        const pFill = document.getElementById('playerBarFill');
        const pTime = document.getElementById('playerTime');
        if (pFill) pFill.style.width = `${pct}%`;
        if (pTime) {
          const cM = Math.floor(cur / 60); const cS = Math.floor(cur % 60);
          const dM = Math.floor(dur / 60); const dS = Math.floor(dur % 60);
          pTime.innerText = `${cM}:${cS < 10 ? '0' : ''}${cS} / ${dM}:${dS < 10 ? '0' : ''}${dS}`;
        }
      };

      globalAudio.onended = () => {
        const icon = document.getElementById('playerIcon');
        if (icon) icon.innerText = '▶';
        if (prepSecs > 0) {
          startGenericPreparation(prepSecs, recSecs);
        } else {
          playPearsonBeep();
          setTimeout(() => startGenericRecording(recSecs), 350);
        }
      };
    }

    function formatSeconds(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    /* LISTENING AUDIO PLAYER HANDLERS */
    function startListeningCountdownAndPlay(audioSrc, prepSecs) {
      countdownSecs = prepSecs;
      const statusEl = document.getElementById('lstStatus');
      statusEl.style.color = '#d9381e';
      statusEl.innerText = `Beginning in ${countdownSecs}`;

      countdownInterval = setInterval(() => {
        countdownSecs--;
        if (countdownSecs > 0) {
          statusEl.innerText = `Beginning in ${countdownSecs}`;
        } else {
          clearInterval(countdownInterval);
          statusEl.innerText = "Playing";
          playListeningAudioPrompt(audioSrc, true);
        }
      }, 1000);
    }

    function playListeningAudioPrompt(audioSrc, unlockNextOnEnd) {
      globalAudio.src = audioSrc;
      globalAudio.load();

      let playStarted = false;
      globalAudio.oncanplaythrough = () => {
        if (!playStarted) {
          playStarted = true;
          globalAudio.play().catch(e => console.log("Audio Play:", e));
          const pIcon = document.getElementById('lstPlayerIcon');
          if (pIcon) pIcon.innerText = '⏸';
        }
      };

      globalAudio.ontimeupdate = () => {
        const cur = globalAudio.currentTime || 0;
        const dur = globalAudio.duration || 1;
        const pct = (cur / dur) * 100;
        const pFill = document.getElementById('lstBarFill');
        const pTime = document.getElementById('lstPlayerTime');
        if (pFill) pFill.style.width = `${pct}%`;
        if (pTime) {
          const cM = Math.floor(cur / 60); const cS = Math.floor(cur % 60);
          const dM = Math.floor(dur / 60); const dS = Math.floor(dur % 60);
          pTime.innerText = `${cM}:${cS < 10 ? '0' : ''}${cS} / ${dM}:${dS < 10 ? '0' : ''}${dS}`;
        }
      };

      globalAudio.onended = () => {
        const icon = document.getElementById('lstPlayerIcon');
        const st = document.getElementById('lstStatus');
        if (icon) icon.innerText = '▶';
        if (st) { st.innerText = 'Completed'; st.style.color = '#333'; }
        if (unlockNextOnEnd) {
          nextBtn.disabled = false;
        }
      };
    }

    function renderHIWText(rawText) {
      const container = document.getElementById('hiwPassage');
      const paragraphs = rawText.split('\n\n');
      let html = '';

      paragraphs.forEach((pText, pIdx) => {
        const tokens = pText.split(/(\s+)/);
        let pHTML = '<p style="margin-bottom: ' + (pIdx === 0 ? '14px' : '0') + ';">';
        tokens.forEach(tok => {
          if (tok.trim() === '') {
            pHTML += tok;
          } else {
            const clean = tok.replace(/^[^\w]+|[^\w]+$/g, '').toLowerCase();
            pHTML += `<span class="hiw-word" data-word="${clean}" onclick="toggleHIWWord(this)">${tok}</span>`;
          }
        });
        pHTML += '</p>';
        html += pHTML;
      });
      container.innerHTML = html;
    }

    function toggleHIWWord(el) {
      el.classList.toggle('selected');
      const clean = el.getAttribute('data-word');
      if (el.classList.contains('selected')) {
        hiwSelectedWords.add(clean);
      } else {
        hiwSelectedWords.delete(clean);
      }
    }

    /* READING RO & DRAG DROP HELPERS */
    function selectROCard(cardEl) {
      document.querySelectorAll('.ro-card').forEach(c => c.classList.remove('selected'));
      currentSelectedCard = cardEl;
      cardEl.classList.add('selected');
    }

    function handleDragStartRO(e) {
      e.dataTransfer.setData("text/plain", e.target.id);
      selectROCard(e.target);
    }

    function allowDropRO(e) {
      e.preventDefault();
      const slot = e.target.closest('.ro-slot');
      if (slot) slot.classList.add('drag-over');
    }

    function handleDropRO(e) {
      e.preventDefault();
      document.querySelectorAll('.ro-slot').forEach(s => s.classList.remove('drag-over'));
      const slot = e.target.closest('.ro-slot');
      const cardId = e.dataTransfer.getData("text/plain");
      const card = document.getElementById(cardId);

      if (slot && card) {
        if (slot.firstElementChild && slot.firstElementChild !== card) {
          const existingCard = slot.firstElementChild;
          const oldParent = card.parentElement;
          if (oldParent) oldParent.appendChild(existingCard);
        }
        slot.appendChild(card);
      }
    }

    function moveSelectedCard(direction) {
      if (!currentSelectedCard) return;
      const targetTable = direction === 'to_target' ? document.getElementById('roTargetTable') : document.getElementById('roSourceTable');
      const emptySlot = Array.from(targetTable.querySelectorAll('.ro-slot')).find(s => s.children.length === 0);
      if (emptySlot) emptySlot.appendChild(currentSelectedCard);
    }

    function shiftCardOrder(offset) {
      if (!currentSelectedCard) return;
      const currentSlot = currentSelectedCard.parentElement;
      if (!currentSlot || !currentSlot.dataset.slotId.startsWith('tgt_')) return;

      const targetSlots = Array.from(document.querySelectorAll('#roTargetTable .ro-slot'));
      const currIdx = targetSlots.indexOf(currentSlot);
      const newIdx = currIdx + offset;

      if (newIdx >= 0 && newIdx < targetSlots.length) {
        const destSlot = targetSlots[newIdx];
        const destCard = destSlot.firstElementChild;
        destSlot.appendChild(currentSelectedCard);
        if (destCard) currentSlot.appendChild(destCard);
      }
    }

    function handleDragStartFIB(e) {
      draggedElementId = e.target.id;
      e.dataTransfer.setData("text/plain", e.target.id);
    }

    function allowDropFIB(e) { e.preventDefault(); }

    function handleDropFIB(e) {
      e.preventDefault();
      const dropZone = e.target.closest('.drop-target');
      if (dropZone && draggedElementId) {
        const el = document.getElementById(draggedElementId);
        if (el && el.classList.contains('word-chip')) {
          if (dropZone.children.length > 0) {
            document.getElementById('wordPool').appendChild(dropZone.children[0]);
          }
          dropZone.appendChild(el);
        }
      }
    }

    function handleDropPool(e) {
      e.preventDefault();
      if (draggedElementId) {
        const el = document.getElementById(draggedElementId);
        if (el && el.classList.contains('word-chip')) {
          document.getElementById('wordPool').appendChild(el);
        }
      }
    }

    /* WRITING & CLIPBOARD HELPERS */
    function preventKeyboardShortcuts(e) {
      if ((e.ctrlKey || e.metaKey) && ['c', 'v', 'x', 'a'].includes(e.key.toLowerCase())) {
        if (e.key.toLowerCase() === 'a') return;
        e.preventDefault();
      }
      if (e.shiftKey && e.key === "Insert") e.preventDefault();
      if (e.ctrlKey && e.key === "Insert") e.preventDefault();
    }

    function editorCopy(id) {
      const el = document.getElementById(id);
      if (el.selectionStart !== el.selectionEnd) {
        internalClipboard = el.value.substring(el.selectionStart, el.selectionEnd);
      }
    }

    function editorCut(id) {
      const el = document.getElementById(id);
      const start = el.selectionStart; const end = el.selectionEnd;
      if (start !== end) {
        internalClipboard = el.value.substring(start, end);
        el.value = el.value.substring(0, start) + el.value.substring(end);
        el.selectionStart = el.selectionEnd = start;
        updateWordCount(id, id === 'swtText' ? 'swtWordCount' : (id === 'weText' ? 'weWordCount' : 'sstWordCount'));
      }
    }

    function editorPaste(id) {
      if (!internalClipboard) return;
      const el = document.getElementById(id);
      const start = el.selectionStart; const end = el.selectionEnd;
      el.value = el.value.substring(0, start) + internalClipboard + el.value.substring(end);
      el.selectionStart = el.selectionEnd = start + internalClipboard.length;
      updateWordCount(id, id === 'swtText' ? 'swtWordCount' : (id === 'weText' ? 'weWordCount' : 'sstWordCount'));
    }

    function getWordCount(text) {
      const clean = text.trim();
      return clean ? clean.split(/\s+/).length : 0;

    /* MIC CHECK FUNCTIONS */
    async function startMicCheckRec() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        testAudioChunks = [];
        testMediaRecorder = new MediaRecorder(stream);
        testMediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) testAudioChunks.push(e.data); };
        testMediaRecorder.onstop = () => {
          const blob = new Blob(testAudioChunks, { type: 'audio/ogg; codecs=opus' });
          if (micTestAudioUrl) URL.revokeObjectURL(micTestAudioUrl);
          micTestAudioUrl = URL.createObjectURL(blob);
          document.getElementById('btnPlayTest').disabled = false;
          document.getElementById('btnNext').disabled = false;
          document.getElementById('micCheckStatus').style.display = "block";
        };
        testMediaRecorder.start();
        document.getElementById('btnRecTest').disabled = true;
        document.getElementById('btnRecTest').classList.add('recording');
        document.getElementById('btnStopTest').disabled = false;
        document.getElementById('btnPlayTest').disabled = true;
        document.getElementById('micCheckStatus').style.display = "none";
      } catch (err) {
        alert("Microphone access denied.");
      }
    }

    function stopMicCheckRec() {
      if (testMediaRecorder && testMediaRecorder.state === "recording") testMediaRecorder.stop();
      document.getElementById('btnRecTest').disabled = false;
      document.getElementById('btnRecTest').classList.remove('recording');
      document.getElementById('btnStopTest').disabled = true;
    }

    function playMicCheckRec() {
      if (micTestAudioUrl) {
        globalAudio.src = micTestAudioUrl;
        globalAudio.play();
      }
    }

      if (mediaRecorder && mediaRecorder.state === "recording") {

        startReadingContinuousTimer();
      } else if (["FIB_RW", "RO", "FIB_R", "MC_R_SINGLE", "MC_R_MULTI"].includes(item.type)) {

          readingResponses[currentStepIndex] = {};
          Object.keys(item.dropdowns).forEach(k => {
            readingResponses[currentStepIndex][k] = document.getElementById(k)?.value || "Empty";
          });
        } else if (item.type === "RO") {
          const targetSlots = document.querySelectorAll('#roTargetTable .ro-slot');
          readingResponses[currentStepIndex] = [];
          targetSlots.forEach(slot => {
            if (slot.firstElementChild) {
              readingResponses[currentStepIndex].push(slot.firstElementChild.id.replace('ro_card_', ''));
            }
          });
        } else if (item.type === "FIB_R") {
          readingResponses[currentStepIndex] = {};
          Object.keys(item.answers).forEach(k => {
            const zone = document.getElementById(k);
            readingResponses[currentStepIndex][k] = zone && zone.firstElementChild ? zone.firstElementChild.innerText.trim() : "Empty";
          });
        }

        // Check if Reading Section is ending to submit Reading Report
        if (item.type === "MC_R_SINGLE") {
          const selected = document.querySelector('input[name="mc_r_single"]:checked');
          readingResponses[currentStepIndex] = selected ? selected.value : "Empty";
        } else if (item.type === "MC_R_MULTI") {
          const checked = [...document.querySelectorAll('input[name="mc_r_multi"]:checked')].map(el => el.value);
          readingResponses[currentStepIndex] = checked.length ? checked : ["Empty"];
        }

        if (item.readingIndex === 16) {
          sendReadingConsolidatedReport();
        }
      } else if (item.type === "SST") {
        const sstVal = document.getElementById('sstText').value.trim();
        sendTextToTelegram("Summarize Spoken Text 1", sstVal, getWordCount(sstVal));
      } else if (item.type === "MC_L_SINGLE") {
        const selected = document.querySelector('input[name="mc_l_single"]:checked');
        window.__mockBag.scores[item.title] = { response: selected ? selected.value : "Empty", correct: item.answer };
      } else if (item.type === "MC_L_MULTI") {
        const checked = [...document.querySelectorAll('input[name="mc_l_multi"]:checked')].map(el => el.value);
        window.__mockBag.scores[item.title] = { response: checked, correct: item.answers };
      } else if (item.type === "HCS") {
        const selected = document.querySelector('input[name="hcs"]:checked');
        window.__mockBag.scores[item.title] = { response: selected ? selected.value : "Empty", correct: item.answer };
      } else if (item.type === "SMW") {
        const selected = document.querySelector('input[name="smw"]:checked');
        window.__mockBag.scores[item.title] = { response: selected ? selected.value : "Empty", correct: item.answer };
      } else if (item.type === "LFIB") {
        let score = 0;
        let details = [];
        const ansKeys = Object.keys(item.answers);
        ansKeys.forEach((k, idx) => {
          const userVal = document.getElementById(`blank${idx + 1}`)?.value.trim() || "";
          const correctVal = item.answers[k];
          if (userVal.toLowerCase() === correctVal.toLowerCase()) {
            score++;
            details.push(`  Blank ${idx + 1}: ✅ ${userVal}`);
          } else {
            details.push(`  Blank ${idx + 1}: ❌ ${userVal || '[Empty]'} (Correct: ${correctVal})`);
          }
        });
        sendLFIBResultToTelegram(score, ansKeys.length, details, item.title);
      } else if (item.type === "HIW") {
        const targetKeys = Object.keys(item.incorrectTargets);
        let correctPicks = 0;
        let wrongPicks = 0;
        let details = [];

        hiwSelectedWords.forEach(word => {
          if (item.incorrectTargets[word]) {
            correctPicks++;
            details.push(`  ✅ [${word}] ➔ Audio: "${item.incorrectTargets[word]}"`);
          } else {
            wrongPicks++;
            details.push(`  ❌ [${word}] ➔ (Incorrect Pick - Negative Mark)`);
          }
        });

        targetKeys.forEach(tKey => {
          if (!hiwSelectedWords.has(tKey)) {
            details.push(`  ⚠️ [${tKey}] ➔ Missed (Audio: "${item.incorrectTargets[tKey]}")`);
          }
        });

        const finalScore = Math.max(0, correctPicks - wrongPicks);
        sendHIWResultToTelegram(finalScore, targetKeys.length, correctPicks, wrongPicks, details, item.title);
      } else if (item.type === "WFD") {
        const userText = document.getElementById('wfdInput').value.trim();
        const targetWords = item.sentence.split(/\s+/).map(cleanWordPreserveCase).filter(w => w);
        const userWords = userText.split(/\s+/).map(cleanWordPreserveCase).filter(w => w);

        let matchedWords = [];
        let missedWords = [];
        let capErrors = [];
        let tempUserWords = [...userWords];

        targetWords.forEach(tWord => {
          const exactIdx = tempUserWords.indexOf(tWord);
          if (exactIdx !== -1) {
            matchedWords.push(tWord);
            tempUserWords.splice(exactIdx, 1);
          } else {
            const caseInsensitiveIdx = tempUserWords.findIndex(uW => uW.toLowerCase() === tWord.toLowerCase());
            if (caseInsensitiveIdx !== -1) {
              const wrongCaseWord = tempUserWords[caseInsensitiveIdx];
              capErrors.push(`[${wrongCaseWord} ➔ Should be: ${tWord}]`);
              missedWords.push(`${tWord} (Capitalization Error: typed '${wrongCaseWord}')`);
              tempUserWords.splice(caseInsensitiveIdx, 1);
            } else {
              missedWords.push(tWord);
            }
          }
        });

        const score = matchedWords.length;
        const totalWords = targetWords.length;
        const percentage = Math.round((score / totalWords) * 100);

        wfdUserSubmissions.push({
          id: item.title,
          userText: userText || "[No response typed]",
          score: score,
          totalWords: totalWords,
          percentage: percentage,
          matchedWords: matchedWords,
          missedWords: missedWords,
          capErrors: capErrors
        });
      }

      globalAudio.pause();
      clearInterval(prepTimer);
      clearInterval(recTimer);

      if (currentStepIndex < examFlow.length - 1) {
        currentStepIndex++;
        setTimeout(() => renderCurrentStep(), 450);
      } else {
        finishAllExam();
      }
    }

    function sendReadingConsolidatedReport() {
      let grandTotalScore = 0;
      let grandMaxScore = 0;
      let sectionScores = {
        FIB_RW: { score: 0, max: 0, label: "Reading & Writing FIB (FIB-RW)" },
        RO: { score: 0, max: 0, label: "Re-order Paragraphs (RO)" },
        FIB_R: { score: 0, max: 0, label: "Reading FIB (FIB-R)" },
        MC_R_SINGLE: { score: 0, max: 0, label: "MC Single Answer" },
        MC_R_MULTI: { score: 0, max: 0, label: "MC Multiple Answers" }
      };
      let reportSections = [];

      examFlow.forEach((q, idx) => {
        if (!["FIB_RW", "RO", "FIB_R", "MC_R_SINGLE", "MC_R_MULTI"].includes(q.type)) return;

        const resp = readingResponses[idx] || {};
        let qScore = 0;
        let qMax = 0;
        let details = [];

        if (q.type === "FIB_RW" || q.type === "FIB_R") {
          const keys = Object.keys(q.answers);
          qMax = keys.length;
          keys.forEach((k, bIdx) => {
            const userVal = resp[k] || "Empty";
            const correctVal = q.answers[k];
            if (userVal.toLowerCase() === correctVal.toLowerCase()) {
              qScore++;
              details.push(`  Blank ${bIdx + 1}: ✅ ${userVal}`);
            } else {
              details.push(`  Blank ${bIdx + 1}: ❌ ${userVal} (Correct: ${correctVal})`);
            }
          });
        } else if (q.type === "RO") {
          const userOrder = resp || [];
          qMax = q.correctOrder.length - 1;
          for (let i = 0; i < q.correctOrder.length - 1; i++) {
            const pair1 = q.correctOrder[i];
            const pair2 = q.correctOrder[i + 1];
            const uIdx = userOrder.indexOf(pair1);
            if (uIdx !== -1 && userOrder[uIdx + 1] === pair2) {
              qScore++;
              details.push(`  Pair ${i + 1}: ✅ [${pair1} ➔ ${pair2}]`);
            } else {
              details.push(`  Pair ${i + 1}: ❌ Missed (Correct: [${pair1} ➔ ${pair2}])`);
            }
          }
        } else if (q.type === "MC_R_SINGLE") {
          qMax = 1;
          if (String(resp) === String(q.answer)) { qScore = 1; details.push("  ✅ Correct"); }
          else { details.push(`  ❌ ${resp} (Correct: ${q.answer})`); }
        } else if (q.type === "MC_R_MULTI") {
          const correctSet = new Set(q.answers || []);
          const chosen = Array.isArray(resp) ? resp : [];
          qMax = correctSet.size;
          chosen.forEach(c => { if (correctSet.has(c)) qScore += 1; else qScore -= 1; });
          qScore = Math.max(0, qScore);
          details.push(`  Selected: ${chosen.join(" | ") || "none"}`);
        }

        grandTotalScore += qScore;
        grandMaxScore += qMax;
        if (sectionScores[q.type]) {
          sectionScores[q.type].score += qScore;
          sectionScores[q.type].max += qMax;
        }
        reportSections.push(`📌 ${q.title}: ${qScore}/${qMax}\n` + details.join('\n'));
      });

      const readingTelegramReport = `🎯 <b>PTE ROOM Mock Result (Reading Section)</b>\n` +
        `👤 Candidate: ${studentName}\n` +
        `📊 Total Reading Score: ${grandTotalScore} / ${grandMaxScore}\n\n` +
        `📑 <b>Section Breakdown:</b>\n` +
        `• ${sectionScores.FIB_RW.label}: ${sectionScores.FIB_RW.score}/${sectionScores.FIB_RW.max}\n` +
        `• ${sectionScores.RO.label}: ${sectionScores.RO.score}/${sectionScores.RO.max}\n` +
        `• ${sectionScores.FIB_R.label}: ${sectionScores.FIB_R.score}/${sectionScores.FIB_R.max}\n\n` +
        `----------------------------\n` +
        reportSections.join('\n\n') +
        `\n----------------------------`;

      sendTelegramMessage(readingTelegramReport);
      window.__mockBag.scores["Reading"] = {
        totalScore: grandTotalScore,
        maxScore: grandMaxScore,
        sections: sectionScores,
        details: reportSections
      };
    }

    /* ===== OBJECTIVE SCORING (no AI) ===== */
    function computeObjectiveScores() {
      const report = {
        reading: { score: 0, max: 0, items: [] },
        listening: { score: 0, max: 0, items: [] },
        asq: { score: 0, max: 0, items: [] },
        wfd: { score: 0, max: 0, items: [] }
      };

      // --- Reading from readingResponses + examFlow ---
      examFlow.forEach((q, idx) => {
        if (!["FIB_RW", "RO", "FIB_R", "MC_R_SINGLE", "MC_R_MULTI"].includes(q.type)) return;
        const resp = readingResponses[idx];
        let score = 0, max = 0, note = "", detail = "", ok = false;

        if (q.type === "FIB_RW" || q.type === "FIB_R") {
          const keys = Object.keys(q.answers || {});
          max = keys.length;
          const parts = [];
          keys.forEach(k => {
            const userRaw = String((resp && resp[k]) || "Empty");
            const user = userRaw.trim().toLowerCase();
            const ans = String(q.answers[k]).trim().toLowerCase();
            const hit = user && user === ans;
            if (hit) score++;
            parts.push(`${k}: ${hit ? "✅" : "❌"} you «${userRaw}» → ${q.answers[k]}`);
          });
          note = `${score}/${max} blanks`;
          detail = parts.join(" · ");
          ok = score === max;
        } else if (q.type === "RO") {
          const userOrder = Array.isArray(resp) ? resp : [];
          max = Math.max(0, (q.correctOrder || []).length - 1);
          for (let i = 0; i < max; i++) {
            const a = q.correctOrder[i], b = q.correctOrder[i + 1];
            const u = userOrder.indexOf(a);
            if (u !== -1 && userOrder[u + 1] === b) score++;
          }
          note = `${score}/${max} pairs`;
          detail = `Your order: [${userOrder.join(", ")}] · Correct: [${(q.correctOrder || []).join(", ")}]`;
          ok = score === max;
        } else if (q.type === "MC_R_SINGLE") {
          max = 1;
          score = String(resp || "") === String(q.answer || "") ? 1 : 0;
          note = score ? "correct" : "wrong";
          detail = `You: ${resp || "—"} · Correct: ${q.answer}`;
          ok = score === 1;
        } else if (q.type === "MC_R_MULTI") {
          const correctSet = new Set(q.answers || []);
          const chosen = Array.isArray(resp) ? resp : [];
          max = correctSet.size;
          chosen.forEach(c => { score += correctSet.has(c) ? 1 : -1; });
          score = Math.max(0, score);
          note = `${score}/${max}`;
          detail = `You: ${(chosen || []).join(" | ") || "—"} · Correct: ${(q.answers || []).join(" | ")}`;
          ok = score === max;
        }

        report.reading.score += score;
        report.reading.max += max;
        report.reading.items.push({ title: q.title, type: q.type, score, max, note, detail, ok });
      });

      // --- Listening MC / HCS / SMW ---
      examFlow.forEach((q) => {
        if (!["MC_L_SINGLE", "MC_L_MULTI", "HCS", "SMW"].includes(q.type)) return;
        const bag = window.__mockBag.scores[q.title];
        let score = 0, max = 1, note = "no response", detail = "", ok = false;
        if (q.type === "MC_L_MULTI") {
          max = (q.answers || []).length;
          const chosen = (bag && Array.isArray(bag.response)) ? bag.response : [];
          const correctSet = new Set(q.answers || []);
          chosen.forEach(c => { score += correctSet.has(c) ? 1 : -1; });
          score = Math.max(0, score);
          note = `${score}/${max}`;
          detail = `You: ${chosen.join(" | ") || "—"} · Correct: ${(q.answers || []).join(" | ")}`;
          ok = score === max;
        } else {
          const resp = bag ? bag.response : "Empty";
          score = String(resp) === String(q.answer) ? 1 : 0;
          note = score ? "correct" : "wrong";
          detail = `You: ${resp || "—"} · Correct: ${q.answer}`;
          ok = score === 1;
        }
        report.listening.score += score;
        report.listening.max += max;
        report.listening.items.push({ title: q.title, type: q.type, score, max, note, detail, ok });
      });

      // --- LFIB / HIW ---
      Object.keys(window.__mockBag.scores).forEach(k => {
        const s = window.__mockBag.scores[k];
        if (!s || typeof s !== "object") return;
        if (s.type === "LFIB" || s.type === "HIW") {
          const score = s.score || 0;
          const max = s.maxScore || 0;
          report.listening.score += score;
          report.listening.max += max;
          report.listening.items.push({
            title: k,
            type: s.type,
            score,
            max,
            note: s.type === "HIW" ? "net" : "blanks",
            detail: Array.isArray(s.details) ? s.details.join(" · ") : "",
            ok: max > 0 && score === max
          });
        }
      });

      // --- WFD ---
      wfdUserSubmissions.forEach(sub => {
        report.wfd.score += sub.score || 0;
        report.wfd.max += sub.totalWords || 0;
        const q = examFlow.find(x => x.type === "WFD" && x.title === sub.id);
        report.wfd.items.push({
          title: sub.id,
          score: sub.score,
          max: sub.totalWords,
          percentage: sub.percentage,
          userText: sub.userText,
          detail: `You: ${sub.userText || "—"} · Target: ${(q && q.sentence) || "—"} · Matched: ${(sub.matchedWords || []).join(", ") || "none"}`,
          ok: sub.score === sub.totalWords
        });
      });

      // totals
      const totalScore = report.reading.score + report.listening.score + report.wfd.score + report.asq.score;
      const totalMax = report.reading.max + report.listening.max + report.wfd.max + report.asq.max;
      const percentage = totalMax > 0 ? Math.round((totalScore / totalMax) * 100) : 0;

      window.__mockBag.objective = {
        ...report,
        totalScore,
        totalMax,
        percentage,
        scoredAt: new Date().toISOString()
      };

      // also mirror summary under scores
      window.__mockBag.scores.objectiveSummary = {
        reading: `${report.reading.score}/${report.reading.max}`,
        listening: `${report.listening.score}/${report.listening.max}`,
        wfd: `${report.wfd.score}/${report.wfd.max}`,
        total: `${totalScore}/${totalMax}`,
        percentage
      };

      return window.__mockBag.objective;
    }

    }

    async function sendTextToTelegram(taskTitle, content, wordCount) {
      window.__mockBag.answers[taskTitle] = {
        type: "text",
        text: content || "",
        wordCount: wordCount || 0
      };
    }

    async function sendLFIBResultToTelegram(score, maxScore, details, title) {
      const key = title || "LFIB";
      window.__mockBag.scores[key] = { type: "LFIB", score, maxScore, details };
    }

    async function sendHIWResultToTelegram(score, maxScore, correctCount, wrongCount, details, title) {
      const key = title || "HIW";
      window.__mockBag.scores[key] = { type: "HIW", score, maxScore, correctCount, wrongCount, details };
    }

    async function deliverResultsByEmail() {
      window.__mockBag.studentName = studentName || "Candidate";
      window.__mockBag.finishedAt = new Date().toISOString();

      const payload = {
        studentName: window.__mockBag.studentName,
        teacherEmail: TEACHER_EMAIL,
        startedAt: window.__mockBag.startedAt,
        finishedAt: window.__mockBag.finishedAt,
        answers: window.__mockBag.answers,
        scores: window.__mockBag.scores,
        objective: window.__mockBag.objective || null,
        wfd: wfdUserSubmissions,
        reading: readingResponses
      };

      try {
        const res = await fetch(API_SEND_RESULT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error("status " + res.status);
        console.log("Result email request sent");
      } catch (e) {
        console.warn("Email API not ready yet — results kept in window.__mockBag", e);
        // Fallback: download a JSON report in the browser
        try {
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `pte-mock-result-${(studentName || "candidate").replace(/\s+/g, "_")}.json`;
          a.click();
        } catch (_) {}
      }
    }

    window.onload = async () => {
      await initMicrophone();
      renderCurrentStep();
    };
  </script>
</body>
</html>
